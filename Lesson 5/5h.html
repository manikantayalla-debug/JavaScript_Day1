<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 5h</title>
        <script>
            let cartQuantity = 0;

        </script>
        
    </head>
    <body>
        <p>Cart Quantity</p>
        <button class="show-quantity-button" onclick="
            console.log('Cart quantity: '+cartQuantity);
        ">
            Show Quantity
        </button>
        <button class="add-cart-button" onclick="
        cartQuantity +=1;
        console.log('Cart quantity: '+cartQuantity);
        ">
            Add to Cart
        </button>
        <button class="+2-button" onclick="
        cartQuantity +=2;
        console.log('Cart quantity: '+cartQuantity);
        ">
            +2
        </button>
        <button class="+3-button" onclick="
        cartQuantity +=3;
        console.log('Cart quantity: '+cartQuantity);
        ">
            +3
        </button>
        <button class="4-button" onclick="
        cartQuantity +=4;
        console.log('Cart quantity: '+cartQuantity);
        ">
            +4
        </button>
        <button class="+5-button" onclick="
        cartQuantity +=5;
        console.log('Cart quantity: '+cartQuantity);
        ">
            +5
        </button>
        <button class="reset" onclick="
        cartQuantity = 0;
        console.log('Cart quantity: '+cartQuantity);
        ">
            Reset Cart
        </button>
    </body>
</html>
