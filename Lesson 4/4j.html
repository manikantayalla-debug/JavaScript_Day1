<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 4j</title>
        <script>
                function cart_message(){
                    alert("Added to cart!");
                }
                function buy_button(){
                    console.log("Loading...");
                    alert("Purchased");
                }
        </script>
        <style>
            p{
                font-size: 20px;
            }
            .cart-button{
                background-color: yellow;
                border-style: solid;
                margin-right: 2px;
            }
            .buy-button{
                background-color: orange;
                border-style: solid;
            }
        </style>
    </head>
    <body>
        <p>Adults Plaint Cotton T-shirt</p>
        <p>Pricce : $7.99</p>
        <button class="cart-button" onclick="cart_message()">Add to cart</button>
        <button class="buy-button" onclick="buy_button()">Buy now</button>
    </body>
</html>
